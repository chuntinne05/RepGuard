# Capability audit using Ollama models already available on this machine.
# All models see the same deterministic sample from MMLU-Pro train/calibration.

audit:
  seed: 42
  n_samples_per_domain: 10
  domains:
    - math
    - physics
    - computer science
    - history
    - law
    - psychology
    - biology
    - economics
  prompt_mode: direct
  use_synthetic: false
  data_dir: "./data"
  dataset_id: "TIGER-Lab/MMLU-Pro"
  output_dir: "./results/capability_audit_ollama"

agents:
  - name: gemma2-latest
    provider: ollama
    model_id: "gemma2:latest"
    base_url: "http://127.0.0.1:11434"
    temperature: 0.0
    max_tokens: 128
    top_p: 1.0
    requests_per_minute: 1000
    tokens_per_minute: 10000000
    cache_dir: "./.llm_cache"

  - name: qwen3-8b
    provider: ollama
    model_id: "qwen3:8b"
    base_url: "http://127.0.0.1:11434"
    temperature: 0.0
    max_tokens: 128
    top_p: 1.0
    requests_per_minute: 1000
    tokens_per_minute: 10000000
    cache_dir: "./.llm_cache"

  - name: llama3-8b
    provider: ollama
    model_id: "llama3:8b"
    base_url: "http://127.0.0.1:11434"
    temperature: 0.0
    max_tokens: 128
    top_p: 1.0
    requests_per_minute: 1000
    tokens_per_minute: 10000000
    cache_dir: "./.llm_cache"
