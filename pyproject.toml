[build-system]
requires = ["setuptools>=75.0", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "repguard"
version = "0.1.0"
description = "Evidence-Calibrated Reputation Transfer under Imperfect Feedback in Multi-Agent LLM Systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "RepGuard Research Team"},
]
keywords = ["multi-agent", "LLM", "reputation", "trust", "feedback", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.9,<3.0",
    "pyyaml>=6.0.2,<7.0",
    "python-dotenv>=1.0.1,<2.0",
    "datasets>=3.0.0,<4.0",
    "httpx>=0.27.0,<1.0",
    "tenacity>=9.0.0,<10.0",
    "rich>=13.9.0,<14.0",
    "tqdm>=4.66.0,<5.0",
    "numpy>=1.26.0,<3.0",
]

[project.optional-dependencies]
openai = ["openai>=1.50.0,<2.0"]
anthropic = ["anthropic>=0.36.0,<1.0"]
all-providers = ["repguard[openai,anthropic]"]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "ruff>=0.6.0,<1.0",
    "mypy>=1.11.0,<2.0",
    "coverage>=7.6.0,<8.0",
]

[project.scripts]
repguard-run = "repguard.harness.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests requiring network or large data (deselect with '-m \"not slow\"')",
    "smoke: end-to-end smoke tests",
]
